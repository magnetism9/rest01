<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>구자성 | 소방전기설계사</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ====== HERO ====== -->
  <header class="hero">
    <div class="hero__inner">
      <div class="hero__photo-wrap">
        <!-- 사진을 images/ 폴더에 profile.jpg 로 넣어주세요 -->
        <img src="images/profile.jpg" alt="구자성 프로필 사진" class="hero__photo" onerror="this.style.display='none'" />
        <div class="hero__photo-placeholder">GJS</div>
      </div>
      <div class="hero__text">
        <h1 class="hero__name">구자성</h1>
        <p class="hero__title">소방전기설계사</p>
        <p class="hero__subtitle"><!-- 한 줄 소개를 여기에 --></p>
        <div class="hero__contacts">
          <span>📧 wkjd05@gmail.com</span>
          <span>📍 <!-- 지역 --></span>
          <span>📞 <!-- 연락처 --></span>
        </div>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- ====== ABOUT ====== -->
    <section class="section" id="about">
      <h2 class="section__title">자기소개</h2>
      <p class="about__text">
        <!-- 자기소개 내용을 여기에 -->
      </p>
    </section>

    <!-- ====== SKILLS ====== -->
    <section class="section" id="skills">
      <h2 class="section__title">보유 기술 / 자격</h2>
      <div class="skills__grid">
        <!-- 자격증 카드 예시 -->
        <div class="skill-card">
          <span class="skill-card__icon">🔥</span>
          <span class="skill-card__label">소방설비기사</span>
        </div>
        <div class="skill-card">
          <span class="skill-card__icon">⚡</span>
          <span class="skill-card__label">전기기사</span>
        </div>
        <!-- 추가 자격증은 위와 같은 형태로 복사해서 넣으세요 -->
      </div>
    </section>

    <!-- ====== EXPERIENCE ====== -->
    <section class="section" id="experience">
      <h2 class="section__title">경력</h2>
      <div class="timeline">

        <div class="timeline__item">
          <div class="timeline__dot"></div>
          <div class="timeline__content">
            <span class="timeline__period">202X.XX — 현재</span>
            <h3 class="timeline__company">회사명</h3>
            <p class="timeline__role">직책 / 직무</p>
            <ul class="timeline__detail">
              <li>주요 업무 내용</li>
              <li>담당 프로젝트</li>
            </ul>
          </div>
        </div>

        <!-- 추가 경력은 위와 같은 형태로 복사해서 넣으세요 -->

      </div>
    </section>

    <!-- ====== PROJECTS ====== -->
    <section class="section" id="projects">
      <h2 class="section__title">주요 프로젝트</h2>
      <div class="projects__grid">

        <div class="project-card">
          <h3 class="project-card__title">프로젝트명</h3>
          <p class="project-card__desc">프로젝트 내용 및 역할</p>
          <div class="project-card__tags">
            <span class="tag">소방설계</span>
            <span class="tag">전기설계</span>
          </div>
        </div>

        <!-- 추가 프로젝트는 위 카드를 복사해서 넣으세요 -->

      </div>
    </section>

    <!-- ====== EDUCATION ====== -->
    <section class="section" id="education">
      <h2 class="section__title">학력</h2>
      <div class="timeline">
        <div class="timeline__item">
          <div class="timeline__dot"></div>
          <div class="timeline__content">
            <span class="timeline__period">XXXX.XX — XXXX.XX</span>
            <h3 class="timeline__company">학교명</h3>
            <p class="timeline__role">학과 / 전공</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>© 2026 구자성. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
